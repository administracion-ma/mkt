name: Aplicar cambios de schema (db:push)

on:
  workflow_dispatch: {}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Aplicar schema a la base de datos
        run: npm run db:push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
